function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim()}
function stem(t){if(t.length>4&&t.endsWith("s"))return t.slice(0,-1);return t}
function tokens(q){return [...new Set(norm(q).split(" ").map(stem).filter(t=>t.length>1&&!STOP.has(t)))]}
function expand(ts){const out=new Set(ts); for(const t of ts){for(const g of GROUPS){if(g.map(stem).includes(t)) g.map(stem).forEach(x=>out.add(x));}} return [...out]}
function score(item,q){const wanted=tokens(q), expanded=expand(wanted); if(!wanted.length)return 0; const name=norm(item.name),cat=norm(item.category),desc=norm(item.description),blob=name+" "+cat+" "+desc; let s=0, matched=0;
for(const t of wanted){if(name===t)s+=80; if(name.includes(t)){s+=30;matched++} else if(cat.includes(t)){s+=18;matched++} else if(desc.includes(t)){s+=9;matched++} else {const syn=expanded.filter(x=>x!==t).some(x=>blob.includes(x)); if(syn){s+=6;matched++}}}
if(norm(q)===name)s+=120; if(name.includes(norm(q)))s+=50;
return matched? s : 0}
function search(q){return DATA.map(x=>({x,s:score(x,q)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s||a.x.name.localeCompare(b.x.name,"pt-BR")).slice(0,30).map(r=>r.x)}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function render(q){const hits=search(q),r=document.querySelector("#results"),st=document.querySelector("#status");r.innerHTML="";st.textContent=hits.length?hits.length+(hits.length===1?" empresa encontrada.":" empresas encontradas."):"Nenhuma empresa encontrada."; for(const x of hits){const a=document.createElement("a");a.className="card";a.href=x.url;a.target="_top";a.rel="noopener";a.innerHTML=(x.logo?'<img loading="lazy" src="'+esc(x.logo)+'" alt="">':'')+'<div><div class="name">'+esc(x.name)+'</div><div class="desc">'+esc(x.description)+'</div><span class="cta">Ver empresa →</span></div>';r.appendChild(a)};try{parent.postMessage({type:"ta-search-height",height:document.documentElement.scrollHeight},"*")}catch(e){}}
document.querySelector("#f").addEventListener("submit",e=>{e.preventDefault();render(document.querySelector("#q").value)});
const tests=[["flores","Sucrica Flores"],["floricultura","Sucrica Flores"],["buquê","Sucrica Flores"],["arranjo","Sucrica Flores"],["perfume árabe","Vitoriana Flagrâncias"],["parafusos","Mercadão dos Parafusos"],["limpeza","Noval Tapurah Produtos de Limpeza"],["capinha","Rei das Capinhas"],["pneus","SA Pneus e Auto Center"],["embreagem","Edinho Auto Center"],["guincho","Igor Auto Center"],["marmita","Restaurante Fio de Azeite"],["drogaria","Master Farma"],["delivery","Jones entrega"]];
if(new URLSearchParams(location.search).get("qa")==="1"){const qa=document.querySelector("#qa");qa.innerHTML="<b>QA</b><br>"+tests.map(([q,e])=>{const n=search(q)[0]?.name||"";return '<span class="'+(n.includes(e)?"pass":"fail")+'">'+esc(q)+" → "+esc(n||"SEM RESULTADO")+" (esperado: "+esc(e)+")</span>"}).join("<br>")}
try{parent.postMessage({type:"ta-search-ready"},"*")}catch(e){}
</script></body></html>
