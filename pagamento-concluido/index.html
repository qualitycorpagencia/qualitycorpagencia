<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Status do pagamento — STNB Polo Campinas</title>
  <meta name="description" content="Confirmação de pagamento da Confraternização STNB Polo Campinas 2026.">
  <style>
    :root{--red:#b71918;--ink:#171412;--cream:#f7f2eb;--muted:#6c625c}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fff,#f7f2eb);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(560px,100%);background:#fff;border-radius:22px;padding:34px 26px;text-align:center;box-shadow:0 20px 60px rgba(44,25,14,.12)}
    .check{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;background:#e8f7ec;color:#18823b;display:grid;place-items:center;font-size:32px;font-weight:900}
    h1{font-size:34px;line-height:1.05;margin:0 0 14px}
    p{font-size:16px;line-height:1.55;color:var(--muted);margin:0 0 20px}
    .note{background:#f7f2ed;border-left:4px solid var(--red);border-radius:10px;padding:14px;text-align:left;font-size:14px;line-height:1.45;margin:22px 0}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:12px;background:var(--red);color:#fff;text-decoration:none;font-weight:900}
    small{display:block;margin-top:18px;color:#81756e}
  </style>
</head>
<body>
  <main class="card">
    <div class="check" id="mark">…</div>
    <h1 id="title">Verificando pagamento</h1>
    <p id="message">Estamos consultando a confirmação do Asaas.</p>
    <div class="note" id="note">A confirmação só aparece aqui depois que o Asaas notificar o sistema.</div>
    <a href="/">Voltar para a página do evento</a>
    <small>STNB Polo Campinas • Estudo • Caráter • Missão</small>
  </main>
  <script>
    const id = new URLSearchParams(location.search).get('inscricao_id');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const mark = document.getElementById('mark');
    const note = document.getElementById('note');
    let attempts = 0;
    async function checkStatus() {
      if (!id) { title.textContent = 'Não encontramos a inscrição'; message.textContent = 'Fale com a organização para confirmar seus dados.'; mark.textContent = '!'; return; }
      try {
        const r = await fetch('/api/payment-status?inscricao_id=' + encodeURIComponent(id), { cache: 'no-store' });
        const data = await r.json();
        if (r.ok && data.status_pagamento === 'pago') {
          title.textContent = 'Pagamento confirmado'; message.textContent = 'Seu pagamento da Confraternização STNB Polo Campinas foi confirmado.';
          mark.textContent = '✓'; mark.style.background = '#e8f7ec'; mark.style.color = '#18823b';
          note.textContent = 'Sua inscrição está confirmada. Guarde o comprovante até o dia do evento.'; return;
        }
        if (['cancelado','expirado','estornado'].includes(data.status_pagamento)) {
          title.textContent = 'Pagamento não confirmado'; message.textContent = 'O checkout foi cancelado ou expirou. Volte à página do evento para gerar outro pagamento.';
          mark.textContent = '!'; note.textContent = 'Se você já pagou, fale com a organização e envie o comprovante.'; return;
        }
      } catch {}
      attempts += 1;
      if (attempts < 20) setTimeout(checkStatus, 3000);
      else { title.textContent = 'Confirmação em processamento'; message.textContent = 'Ainda não recebemos a confirmação. Não pague novamente agora.'; }
    }
    checkStatus();
  </script>
</body>
</html>
