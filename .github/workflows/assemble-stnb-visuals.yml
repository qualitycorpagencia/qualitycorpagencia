name: Assemble STNB visual assets

on:
  push:
    branches:
      - stnb-confraternizacao-2026
    paths:
      - '.asset-upload-v3/**'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stnb-confraternizacao-2026
          fetch-depth: 0

      - name: Check readiness
        id: ready
        shell: bash
        run: |
          if [ -f .asset-upload-v3/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble and validate
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-upload-v3/logo/part-*.txt | tr -d '\n\r ' | base64 -d > logo-final-user.webp
          cat .asset-upload-v3/hero/part-*.txt | tr -d '\n\r ' | base64 -d > hero-final-user.webp
          python3 - <<'PY'
          from PIL import Image
          for p in ["logo-final-user.webp","hero-final-user.webp"]:
              im=Image.open(p)
              print(p, im.size, im.mode)
              im.verify()
          PY
          test -s logo-final-user.webp
          test -s hero-final-user.webp

      - name: Commit assembled assets
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-upload-v3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A logo-final-user.webp hero-final-user.webp .asset-upload-v3
          git commit -m "Assemble final STNB logo and hero assets"
          git push origin HEAD:stnb-confraternizacao-2026
