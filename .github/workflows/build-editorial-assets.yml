name: Build editorial assets

on:
  push:
    paths:
      - '.asset-upload/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode WebP assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/geovana-lourenco/casal assets/geovana-lourenco/local
          cat .asset-upload/hero/part-*.txt | base64 -d > assets/geovana-lourenco/casal/hero-casal-horizontal.webp
          cat .asset-upload/casal-elegante/part-*.txt | base64 -d > assets/geovana-lourenco/casal/casal-elegante-vertical.webp
          cat .asset-upload/noivado/part-*.txt | base64 -d > assets/geovana-lourenco/casal/noivado-vertical.webp
          cat .asset-upload/local/part-*.txt | base64 -d > assets/geovana-lourenco/local/ballroom-moress-horizontal.webp
          file assets/geovana-lourenco/casal/*.webp assets/geovana-lourenco/local/ballroom-moress-horizontal.webp
          test -s assets/geovana-lourenco/casal/hero-casal-horizontal.webp
          test -s assets/geovana-lourenco/casal/casal-elegante-vertical.webp
          test -s assets/geovana-lourenco/casal/noivado-vertical.webp
          test -s assets/geovana-lourenco/local/ballroom-moress-horizontal.webp

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/geovana-lourenco/casal/hero-casal-horizontal.webp \
                  assets/geovana-lourenco/casal/casal-elegante-vertical.webp \
                  assets/geovana-lourenco/casal/noivado-vertical.webp \
                  assets/geovana-lourenco/local/ballroom-moress-horizontal.webp
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build editorial WebP assets"
            git push
          fi
